<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>뉴클레오타이드 조립 시뮬레이션</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app">
    <!-- 왼쪽 메뉴 -->
    <div id="sidebar">
      <h1 style="margin-bottom: 5px;">DNA와 RNA의 구조</h1>
      <p class="desc">DNA 또는 RNA 조립 메뉴에서 염기를 선택하면, 상보적 짝을 이룬 뉴클레오타이드 쌍이 즉시 생성되며 5'->3' 방향으로 결합합니다.</p>

      <div class="section-frame">
        <h2>보기 모드</h2>
        <div class="btn-grid">
          <button class="btn mode-btn active" data-mode="simple">단순 모형</button>
          <button class="btn mode-btn" data-mode="atomic">구조 모형</button>
          <button class="btn mode-btn" data-mode="ring">고리 모형</button>
          <button class="btn mode-btn" data-mode="3d">입체 구조</button>
        </div>
        <button id="clear-btn" class="btn danger-btn"
          style="margin-top: 10px; padding: 12px; font-size: 0.95rem; width: 100%;">화면 모두 지우기</button>
      </div>

      <div class="section-frame">
        <h2>1. 뉴클레오타이드 조립</h2>
        <div id="custom-builder">
          <div class="builder-section" style="margin-bottom: 10px;">
            <div class="btn-group">
              <button class="btn builder-btn active" data-btype="phosphate" data-val="yes">인산 포함</button>
              <button class="btn builder-btn" data-btype="phosphate" data-val="no">인산 미포함</button>
            </div>
          </div>
          <div class="builder-section" style="margin-bottom: 10px;">
            <div class="btn-group">
              <button class="btn builder-btn active" data-btype="sugar" data-val="deoxy">디옥시라이보스</button>
              <button class="btn builder-btn" data-btype="sugar" data-val="ribose">라이보스</button>
            </div>
          </div>
          <div class="builder-section" style="margin-bottom: 10px;">
            <div class="btn-grid">
              <button class="btn builder-btn active" data-btype="base" data-val="A">염기 A</button>
              <button class="btn builder-btn" data-btype="base" data-val="T">염기 T</button>
              <button class="btn builder-btn" data-btype="base" data-val="G">염기 G</button>
              <button class="btn builder-btn" data-btype="base" data-val="C">염기 C</button>
              <button class="btn builder-btn" data-btype="base" data-val="U">염기 U</button>
              <button class="btn builder-btn" data-btype="base" data-val="none">염기 없음</button>
            </div>
          </div>
          <button class="btn action-btn" id="spawn-custom-btn" style="margin-top: 5px; padding: 10px; width: 100%;">캔버스에
            독립 생성</button>
        </div>
      </div>

      <div class="section-frame">
        <h2>2. DNA 조립</h2>
        <div class="btn-grid">
          <button class="btn dna-btn" data-base="A">아데닌 (A)</button>
          <button class="btn dna-btn" data-base="T">티민 (T)</button>
          <button class="btn dna-btn" data-base="G">구아닌 (G)</button>
          <button class="btn dna-btn" data-base="C">사이토신 (C)</button>
        </div>
      </div>

      <div class="section-frame">
        <h2>3. RNA 조립</h2>
        <div class="btn-grid">
          <button class="btn rna-btn" data-base="A">아데닌 (A)</button>
          <button class="btn rna-btn" data-base="U">유라실 (U)</button>
          <button class="btn rna-btn" data-base="G">구아닌 (G)</button>
          <button class="btn rna-btn" data-base="C">사이토신 (C)</button>
        </div>
      </div>
    </div>

    <!-- 오른쪽 작업 공간 -->
    <div id="workspace">
      <svg id="svg-container" width="100%" height="100%">
        <defs>
          <radialGradient id="grad-sugar" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#ffccd5" />
            <stop offset="100%" stop-color="#ff8787" />
          </radialGradient>
          <radialGradient id="grad-base-a" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#fff3bf" />
            <stop offset="100%" stop-color="#ffd43b" />
          </radialGradient>
          <radialGradient id="grad-base-t" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#d0bfff" />
            <stop offset="100%" stop-color="#b197fc" />
          </radialGradient>
          <radialGradient id="grad-base-g" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#b2f2bb" />
            <stop offset="100%" stop-color="#69db7c" />
          </radialGradient>
          <radialGradient id="grad-base-c" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#ffc9c9" />
            <stop offset="100%" stop-color="#ff8787" />
          </radialGradient>
          <radialGradient id="grad-base-u" cx="30%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#a5d8ff" />
            <stop offset="100%" stop-color="#74c0fc" />
          </radialGradient>
        </defs>
        <g id="canvas">
          <g id="bonds_layer"></g>
          <g id="nucleotides_layer"></g>
          <g id="layer_3d"></g>
        </g>
      </svg>
      <div class="control-panel">
        <button class="control-btn" id="zoom-in" aria-label="확대">+</button>
        <button class="control-btn" id="zoom-out" aria-label="축소">-</button>
        <button class="control-btn" id="reset-view" aria-label="화면 초기화">⟲</button>
        <button class="control-btn" id="toggle-rotation"
          style="display: none; width: auto; padding: 0 10px; font-size: 0.9rem;">정지</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
